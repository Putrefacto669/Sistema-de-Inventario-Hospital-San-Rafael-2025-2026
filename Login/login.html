<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Clínica San Rafael</title>
    <style>
        /* === Estilo base === */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Frutiger LT Std', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74c6ff, #54a0ff);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: none;
        }

        /* === Textura de fondo: hojas y gotas estáticas.,No se porque no me salen las hojas pipipipi === */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 25%, rgba(100, 180, 100, 0.03) 1px, transparent 2px),
                radial-gradient(circle at 50% 80%, rgba(100, 180, 100, 0.025) 1.5px, transparent 2.5px),
                radial-gradient(circle at 90% 10%, rgba(90, 170, 90, 0.035) 1.2px, transparent 2.2px),
                radial-gradient(circle at 30% 60%, rgba(200, 230, 255, 0.04) 1px, transparent 2px),
                radial-gradient(circle at 70% 40%, rgba(190, 225, 250, 0.035) 0.9px, transparent 1.9px);
            background-size: 300px 300px;
            background-repeat: repeat;
            z-index: -3;
            pointer-events: none;
        }

        /* === Brillo del mouse === */
        #cursor-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, transparent 80%);
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            opacity: 0.9;
        }

        /* === Contenedor del login === */
        .login-container {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 26px;
            padding: 38px;
            width: 340px;
            box-shadow: 
                0 12px 40px rgba(0, 30, 80, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.6);
            text-align: center;
            animation: popIn 1s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            border: 1px solid rgba(255, 255, 255, 0.45);
            z-index: 10;
            position: relative;
            transition: background 0.4s ease;
        }

        .login-container:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        @keyframes popIn {
            0% { transform: scale(0.8) rotate(-2deg); opacity: 0; }
            70% { transform: scale(1.03) rotate(1deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        h2 {
            margin-bottom: 26px;
            color: #003366;
            text-shadow: 0 2px 4px rgba(255,255,255,0.7);
            font-weight: 500;
            letter-spacing: 1px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            margin: 12px 0;
            border-radius: 13px;
            border: 1px solid rgba(173, 216, 230, 0.5);
            background: rgba(255, 255, 255, 0.82);
            font-size: 16px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.07);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInField 0.5s forwards;
        }

        input:nth-child(1) { animation-delay: 0.2s; }
        input:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInField {
            to { opacity: 1; transform: translateY(0); }
        }

        input:focus {
            border-color: #81d4fa;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 0 0 2px rgba(129, 212, 250, 0.4),
                inset 0 1px 5px rgba(0,0,0,0.1);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #64b5f6, #0288d1);
            color: white;
            font-weight: 600;
            letter-spacing: 0.8px;
            box-shadow: 
                0 6px 18px rgba(2, 136, 209, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.5);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20px;
            height: 200%;
            background: rgba(255,255,255,0.4);
            transform: rotate(25deg);
            transition: left 0.5s;
        }

        button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #75bbff, #039be5);
            box-shadow: 
                0 8px 22px rgba(2, 136, 209, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.6);
        }

        button:hover::after {
            left: 120%;
        }

        button:active {
            transform: translateY(0);
            box-shadow: 
                0 4px 14px rgba(2, 136, 209, 0.3),
                inset 0 1px 2px rgba(0,0,0,0.1);
        }

        .error {
            margin-top: 14px;
            color: #d32f2f;
            font-size: 13px;
            height: 18px;
            opacity: 0;
            animation: showError 0.4s forwards;
        }

        @keyframes showError {
            to { opacity: 1; }
        }

        /* === Estilo de burbujas === */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(220,240,255,0.2) 60%, transparent 100%);
            backdrop-filter: blur(5px);
            animation: float 18s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
            box-shadow: 0 0 12px rgba(173, 216, 230, 0.4);
            transform-origin: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(8deg); }
        }

        /* === Hojas/gotas animadas === */
        .floating-element {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 180, 100, 0.12) 50%, transparent 100%);
            z-index: -2;
            pointer-events: none;
            opacity: 0.6;
        }

        .gota {
            background: radial-gradient(circle, rgba(200, 230, 255, 0.15) 50%, transparent 100%);
        }

        @keyframes floatLeaf {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.5; }
            25% { transform: translate(15px, -20px) rotate(5deg); }
            50% { transform: translate(30px, -10px) rotate(10deg); opacity: 0.7; }
            75% { transform: translate(15px, 5px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.5; }
        }

        @keyframes floatDrop {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
            33% { transform: translate(-10px, -25px) rotate(-3deg); }
            66% { transform: translate(-20px, -15px) rotate(-6deg); opacity: 0.8; }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Resplandor del mouse -->
    <div id="cursor-glow"></div>

    <!-- Burbujas -->
    <div id="bubbles"></div>

    <!-- Login -->
    <div class="login-container">
        <h2>Clínica San Rafael</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        // === 1. Resplandor suave del mouse ===
        const glow = document.getElementById('cursor-glow');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let glowX = mouseX;
        let glowY = mouseY;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateGlow() {
            glowX += (mouseX - glowX) / 10;
            glowY += (mouseY - glowY) / 10;
            glow.style.left = glowX + 'px';
            glow.style.top = glowY + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        // === 2. Burbujas dinámicas ===
        const bubblesContainer = document.getElementById('bubbles');
        const bubbleCount = 14;
        const bubbles = [];

        for (let i = 0; i < bubbleCount; i++) {
            const size = Math.random() * 90 + 30;
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            bubble.style.left = posX + '%';
            bubble.style.top = posY + '%';
            bubble.style.animationDelay = Math.random() * 15 + 's';
            bubble.style.animationDuration = (13 + Math.random() * 8) + 's';
            bubble.style.opacity = 0.4 + Math.random() * 0.4;
            bubblesContainer.appendChild(bubble);

            bubbles.push({
                el: bubble,
                originalLeft: posX,
                originalTop: posY
            });
        }

        // Reacción de burbujas al mouse
        document.addEventListener('mousemove', () => {
            bubbles.forEach(b => {
                const rect = b.el.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const threshold = 120;

                if (distance < threshold) {
                    const force = (threshold - distance) / threshold;
                    const angle = Math.atan2(dy, dx);
                    const escapeX = b.originalLeft + Math.cos(angle) * force * 8;
                    const escapeY = b.originalTop + Math.sin(angle) * force * 8;

                    b.el.style.transform = `translate(${escapeX - b.originalLeft}%, ${escapeY - b.originalTop}%) scale(${1 + force * 0.2})`;
                    b.el.style.transition = 'transform 0.3s ease-out';
                } else {
                    b.el.style.transform = 'translate(0, 0) scale(1)';
                    b.el.style.transition = 'transform 0.6s ease-out';
                }
            });
        });

        // === 3. Hojas y gotas animadas ===
        function createFloatingElements() {
            const container = document.body;
            for (let i = 0; i < 3; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'floating-element';
                leaf.style.left = (10 + Math.random() * 80) + '%';
                leaf.style.top = (20 + Math.random() * 60) + '%';
                leaf.style.animation = `floatLeaf ${20 + Math.random() * 12}s infinite ease-in-out`;
                leaf.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(leaf);
            }
            for (let i = 0; i < 2; i++) {
                const drop = document.createElement('div');
                drop.className = 'floating-element gota';
                drop.style.width = '10px';
                drop.style.height = '10px';
                drop.style.left = (15 + Math.random() * 70) + '%';
                drop.style.top = (25 + Math.random() * 50) + '%';
                drop.style.animation = `floatDrop ${25 + Math.random() * 10}s infinite ease-in-out`;
                drop.style.animationDelay = `${Math.random() * 6}s`;
                container.appendChild(drop);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createFloatingElements);
        } else {
            createFloatingElements();
        }

        // === 4. Lógica de login ===
        function login() {
            const user = document.getElementById("usuario").value.trim();
            const pass = document.getElementById("password").value.trim();
            const error = document.getElementById("errorMsg");
            error.textContent = "";

            if (user === "admin" && pass === "password") {
                const btn = document.querySelector('button');
                btn.textContent = "✓ Accediendo...";
                btn.style.background = "linear-gradient(135deg, #66bb6a, #2e7d32)";
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 800);
            } else {
                error.textContent = "Usuario o contraseña incorrectos";
                const container = document.querySelector('.login-container');
                container.style.transform = "translateX(-8px)";
                setTimeout(() => container.style.transform = "translateX(8px)", 100);
                setTimeout(() => container.style.transform = "translateX(0)", 200);
            }
        }
    </script>
</body>
</html>
