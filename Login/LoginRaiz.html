<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Clínica San Rafael</title>
    <!-- El CSS está dentro de una etiqueta <style>, pero lo separamos abajo -->
</head>
<body>
    <!-- Resplandor del mouse -->
    <div id="cursor-glow"></div>

    <!-- Burbujas -->
    <div id="bubbles"></div>

    <!-- Formulario de login -->
    <div class="login-container">
        <h2>Clínica San Rafael</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- El JavaScript está dentro de una etiqueta <script>, pero lo separamos abajo -->
</body>
</html>
